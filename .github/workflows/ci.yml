name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python 3.12 · Ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install uv-managed Python 3.12.16
        run: uv python install --managed-python 3.12.16

      - name: Install dependencies
        run: |
          ci_python="$(uv python find --managed-python --no-python-downloads --system 3.12.16)"
          uv sync --frozen --managed-python --no-python-downloads --python "$ci_python"

      - name: Verify Python and connected SQLite runtimes
        run: .venv/bin/python -m app.db.verify_ci_runtime

      - name: Run Ruff linter
        run: .venv/bin/python -m ruff check .

      - name: Check Ruff formatting
        run: .venv/bin/python -m ruff format --check .

      - name: Run mypy strict type check
        run: .venv/bin/python -m mypy app tests migrations benchmarks

      - name: Run pytest suite
        run: .venv/bin/python -m pytest

  frontend:
    name: Frontend (Node 24 · TypeScript · ESLint · Vitest · Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest unit tests
        run: npm test

      - name: Verify production build
        run: npm run build

  e2e:
    name: E2E (Chromium · isolated FastAPI + SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - name: Install uv-managed Python 3.12.16
        working-directory: backend
        run: uv python install --managed-python 3.12.16
      - name: Prepare Python backend environment
        working-directory: backend
        run: |
          ci_python="$(uv python find --managed-python --no-python-downloads --system 3.12.16)"
          uv sync --frozen --managed-python --no-python-downloads --python "$ci_python"
      - name: Verify Python and connected SQLite runtimes
        working-directory: backend
        run: .venv/bin/python -m app.db.verify_ci_runtime
      - run: npm ci
      - name: Install Chromium and Linux system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run E2E smoke tests
        run: npm run test:e2e
      - name: Upload browser report and failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
